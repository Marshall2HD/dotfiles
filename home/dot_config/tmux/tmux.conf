## ║  YoRHa Terminal Management System    ║
## ╚══════════════════════════════════════╝

# ── Core ──────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

# ── Prefix ────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits ────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Navigation ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload ────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded."

# ── Automata Night Palette ────────────────
# bg:       #1A1313   fg:       #E0DBC1
# accent:   #EBA123   select:   #5C3016
# red:      #B34750   green:    #6B997B
# blue:     #7A97CC   dim:      #4D382F

# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#4D382F,fg=#E0DBC1"

# ▌left: session block
set -g status-left-length 30
set -g status-left "#[bg=#EBA123,fg=#1A1313,bold] ◈ #S #[bg=#4D382F,fg=#EBA123]█▓░ "

# ▌right: indicators
set -g status-right-length 50
set -g status-right "#{?window_zoomed_flag,#[bg=#7A97CC#,fg=#1A1313#,bold] ⊡ ZOOM ,}#{?client_prefix,#[bg=#B34750#,fg=#FAF4DE#,bold] ◈ PREFIX ,#[fg=#918E82] ◈ }"

# ▌windows
set -g window-status-format "#[fg=#918E82] #I:#W "
set -g window-status-current-format "#[bg=#CC7E39,fg=#1A1313,bold] #I:#W "
set -g window-status-separator "#[fg=#4D382F] ◈ "

# ── Pane Borders ──────────────────────────
set -g pane-border-style "fg=#4D382F"
set -g pane-active-border-style "fg=#EBA123"

# ── Messages & Menus ─────────────────────
set -g message-style "bg=#5C3016,fg=#FAF4DE,bold"
set -g mode-style "bg=#5C3016,fg=#FAF4DE"

# ── Copy Mode (vi) ───────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
